{% extends "portfolio_app/base_template.html" %}
<!--Index page uses base format and fills block-->
{% block content %}
 
<h2> welcome to our portfolio Application</h2>

<ul>
    {% for portfolio in active_portfolios %}
        <li><a href="{% url 'portfolio_desc' portfolio.title %}">{{portfolio.title}}</a></li>
        
    {% empty %}
        <li>No Active Portfolios Found</li>
    {% endfor %}
</ul>

{% endblock %}
